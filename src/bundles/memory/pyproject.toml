[project]
name = "lfx-memory"
version = "0.1.0"
description = "Memory components as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "memory"]
dependencies = [
    "lfx>=1.11.0.dev0,<2.0.0",
    "mem0ai>=2.0.2,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

[project.entry-points."langflow.extensions"]
lfx-memory = "lfx_memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_memory"]
include = ["src/lfx_memory/extension.json", "src/lfx_memory/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_memory",
    "README.md",
    "pyproject.toml",
]
